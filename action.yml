name: 'Get current package version'
description: 'Get the current version of the npm package'
branding:
  color: 'gray-dark'
  icon: 'align-center'
inputs:
  path:
    required: false
    default: '.'
    description: 'Path to package.json file (directories only), e.g. packages/mypackage/'
outputs:
  current-version:
    description: 'Current version defined in the package.json file'
runs:
  using: 'docker'
  image: 'docker://ghcr.io/step-security/npm-get-version-action:v1.3.4@sha256:4688393733bc980a004434c397d8791cbd1c6c8dd5fce6bdbdfea27e48d5e2e8' #v1.3.4
  args:
    - ${{ inputs.path }}
